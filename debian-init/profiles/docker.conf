# Профиль docker — сервер под контейнеры.
# Запуск: sudo ./init.sh --profile docker -y
# ВАЖНО: с -y авто-откат SSH не вооружается — проверьте доступ сами.

MODULES="base user firewall ssh sysctl swap updates f2b docker motd"

CFG_TIMEZONE="UTC"
CFG_BASE_UPGRADE=1
CFG_BASE_PURGE=1
CFG_JOURNAL_MAX="500M"

CFG_USER_NAME="admin"
CFG_USER_KEY=""            # ОБЯЗАТЕЛЬНО впишите свой публичный ключ
CFG_USER_SETPASS=0
CFG_USER_NOPASSWD=0

CFG_FW_BACKEND="nftables"
CFG_SSH_PORT="22022"
CFG_FW_SSH_ALLOW=""        # например: "203.0.113.5 198.51.100.0/24"
CFG_FW_TCP="80 443"
CFG_FW_UDP=""
CFG_FW_PING=1

CFG_SSH_NOPASS=1
CFG_SSH_ROOT="no"
CFG_SSH_ALLOWUSERS="admin"
CFG_SSH_ROLLBACK=300

CFG_SYSCTL_BBR=1
CFG_SYSCTL_NOV6=0
CFG_SYSCTL_SWAPPINESS=10
CFG_SWAP_SIZE="2G"

CFG_UPD_REBOOT=0
CFG_UPD_MAIL=""

CFG_F2B_ENGINE="fail2ban"
CFG_F2B_BANTIME="1h"
CFG_F2B_MAXRETRY=5
CFG_F2B_IGNORE=""

CFG_DOCKER_USERGRP=1
CFG_DOCKER_FW=1
CFG_DOCKER_FW_OPEN="80 443"
CFG_DOCKER_FW_ALLOW=""
